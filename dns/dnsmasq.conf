port=53
listen-address=10.7.3.114
bind-interfaces

# NAN project DNS records
# Both domains resolve to the Nginx gateway machine (Kushal)
address=/app.NAN.test/10.7.29.219
address=/api.NAN.test/10.7.29.219

# Forward all other DNS queries to a real upstream resolver
# This ensures that .NAN.test is handled locally,
# but external domains (google.com etc.) still resolve correctly.
server=8.8.8.8
server=1.1.1.1

# Logging (queries logged to stderr for debugging)
log-queries
log-facility=-
