# Upstream backend pool (round-robin by default)
upstream nan_backends {
    server 10.7.20.70:3001;   # Backend A - Chinmay
    server 10.7.0.210:3002;   # Backend B - Prachee

    # Passive health check:
    # If a backend fails to respond, nginx marks it down temporarily
    # and retries the next available backend.
    # max_fails=3 fail_timeout=30s are nginx defaults.
}

# HTTP fallback server (port 8080)
# Useful if port 443 is blocked on a client machine.
server {
    listen 8080;
    server_name app.NAN.test api.NAN.test;

    location / {
        proxy_pass http://nan_backends;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Pass connection errors to next upstream (enables failover)
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

# HTTPS server (TLS terminated at nginx)
server {
    listen 443 ssl;
    server_name app.NAN.test api.NAN.test;

    # TLS certificate and key (private key must NOT be committed to git)
    ssl_certificate     /opt/homebrew/etc/nginx/nan-server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/nan-server.key;

    # TLS hardening
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://nan_backends;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Pass connection errors to next upstream (enables failover)
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
