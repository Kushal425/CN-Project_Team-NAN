worker_processes 1;
daemon off;
pid standby.pid;
error_log stderr notice;

events {
    worker_connections 128;
}

http {
    access_log standby-access.log combined;

    upstream nan_backends {
        server 10.7.26.226:3001;
        server 127.0.0.1:3002;
    }

    server {
        listen 10.7.2.53:443 ssl;
        server_name app.NAN.test api.NAN.test;

        ssl_certificate standby.crt;
        ssl_certificate_key standby.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-NAN-Edge standby always;

        location / {
            proxy_pass http://nan_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_buffering off;
        }
    }
}
